baseURL: https://slim.services/
languageCode: en-us
title: Slim Services | AWS Cloud Consulting

theme: 'hugo-fresh'

googleAnalytics: G-MWCXMMRMT2

outputs:
  home:
    - HTML
    - Sitemap
    # - JSON
    # - RSS

# Disables warnings
disableKinds:
- taxonomy
markup:
  goldmark:
    renderer:
      unsafe: true # Allows you to write raw html in your md files

params:
  # Open graph allows easy social sharing. If you don't want it you can set it to false or just delete the variable
  openGraph: true
  # Used as meta data; describe your site to make Google Bots happy
  description: AWS cloud consulting and services for enterprises and professionals.
  # Preloader ensures images are loaded before displaying to the user. If you don't want it uncomment to set it to false
  # preloader: false
  navbarlogo:
  # Logo (from static/images/logos/___)
    #image: logos/fresh.svg
    image: logos/slim.svg
    link: /
    # Default width/height. Uncomment if you need to change
    width: 240
    height: 28
  font:
    name: "Open Sans"
    sizes: [400,600]
  hero:
    # Main hero title
    title: Cloud Infrastructure. Simplified.
    # Hero subtitle (optional)
    subtitle: Specialized AWS consulting to transform your cloud infrastructure
    # Button text
    buttontext: Request Consulting
    # Where the main hero button links to
    buttonlink: "#contact"
    # Hero image (from static/images/___)
    image: illustrations/worker.svg
    # Footer logos (from static/images/logos/clients/*.svg)
    # urls are optional
    clientlogos:
    - logo: aws
      url: https://aws.amazon.com
    - logo: terraform
      url: https://www.terraform.io
    - logo: kubernetes
      url: https://kubernetes.io
    - logo: docker
      url: https://www.docker.com
    - logo: github
      url: https://github.com
    - logo: gitlab
      url: https://about.gitlab.com
  # Customizable navbar. For a dropdown, add a "sublinks" list.
  navbar:
  - title: Services
    url: /#services
  - title: Solutions
    url: /#solutions
  - title: About
    sublinks:
    - title: Our Company
      url: /#about
    - title: Team
      url: /#team
    - title: Certifications
      url: /#certifications
  - title: Blog
    url: /blog
  - title: Contact
    url: /#contact
    button: true
  sidebar:
    # Logo (from static/images/logos/___.svg)
    logo: fresh-square
    sections:
    - title: User
      icon: user
      links:
      - text: Profile
        url: /
      - text: Account
        url: /
      - text: Settings
        url: /
    - title: Messages
      icon: envelope
      links:
      - text: Inbox
        url: /
      - text: Compose
        url: /
    - title: Images
      icon: image
      links:
      - text: Library
        url: /
      - text: Upload
        url: /
    - title: Settings
      icon: cog
      links:
      - text: User settings
        url: /
      - text: App settings
        url: /
  section1:
    title: AWS Cloud Services
    subtitle: Complete solutions for your digital transformation
    tiles:
    - title: Cloud Architecture
      icon: laptop-cloud
      text: Design and implementation of scalable architectures.
      url: /#services
      buttonText: Learn More
    - title: AWS Migration
      icon: doc-sync
      text: Safe and efficient migration of your applications and data.
      url: /#services
      buttonText: Learn More
    - title: Cost Optimization
      icon: plug-cloud
      text: Reduce cloud spending with resource analysis.
      url: /#services
      buttonText: Learn More
  section2:
    title: Why Choose Slim Services?
    subtitle: AWS expertise focused on results
    features:
    - title: AWS Partner Certification
      text: Our team holds advanced AWS certifications, ensuring best practices and quality solutions for your cloud infrastructure.
      # Icon (from static/images/illustrations/icons/___.svg)
      icon: laptop-globe
    - title: 24/7 Specialized Support
      text: Continuous monitoring of your cloud operations with alerts and specialized technical support available whenever you need it.
      icon: doc-sync
    - title: Continuous Optimization
      text: Periodic analysis of performance, security, and costs to ensure your AWS infrastructure is always optimized and aligned with your goals.
      icon: mobile-feed
  section3:
    title: Customized AWS Solutions
    subtitle: Cloud infrastructure tailored to your needs
    image: illustrations/mockups/app-mockup.png
    buttonText: Request Proposal
    buttonLink: "#contact"
  section4:
    title: Our Clients Trust Us
    subtitle: Successful digital transformation with AWS
    clients:
    - name: Marina Costa
      quote: Slim Services completely transformed our cloud infrastructure. We reduced costs by 40% and significantly improved application performance.
      job: CTO - Technology Company
      img: 1
    - name: Carlos Silva
      quote: Excellent consulting! The Slim Services team helped us migrate to AWS safely and without interruptions. Very professional and attentive.
      job: Operations Director
      img: 2
    - name: Roberto Mendes
      quote: Strategic partnership that made all the difference. Slim Services' AWS expertise is unmatched. I highly recommend it to any company.
      job: Project Manager
      img: 3
  section5:
    title: Let's Talk
    subtitle: Contact us for a free consultation about your cloud infrastructure
    buttonText: Send Message
    # action: https://formspree.io/f/<form_id>
    # method: POST
  footer:
    # Logo (from static/images/logos/___)
    #logo: fresh-white-alt.svg
    logo: slim-white-alt.svg
    # Default width/height. Uncomment if you need to change
    width: 200
    height: 28
    # Social Media Title
    #socialmediatitle: Follow Us
    # Social media links (GitHub, Twitter, etc.). All are optional.
    #socialmedia:
    #- link: https://github.com/slimservices
    #  # Icons are from Font Awesome
    #  icon: github
    #- link: https://github.com/#
    #  icon: instagram
    #- link: https://facebook.com/#
    #  icon: linkedin
    #- link: https://twitter.com/#
    #  icon: twitter
    #- link: https://bitbucket.org/#
    #  icon: bitbucket
    bulmalogo: true
    quicklinks:
      column1:
        title: "Solutions"
        links:
        - text: Cloud Architecture
          link: /
        - text: AWS Migration
          link: /
        - text: Cost Optimization
          link: /
        - text: Support & Monitoring
          link: /
        - text: Terms
          link: /
      column2:
        title: "Resources"
        links:
        - text: Getting Started
          link: /
        - text: Documentation
          link: /
        - text: Best Practices
          link: /
        - text: Developers
          link: /
      column3:
        title: "Company"
        links:
        - text: Latest News
          link: /blog/first
        - text: Case Studies
          link: /blog/second
