  section1:
    title: Reduza Custos e Ganhe Escala com a Nuvem
    subtitle: Soluções completas para sua jornada cloud
    tiles:
    - title: Migração para Cloud
      icon: cloud-arrow-up
      text: Migração segura com arquitetura escalável e mínimo risco.
      url: /#services
      buttonText: Saiba Mais
    - title: Modernização de Aplicações
      icon: arrow-up-right-dots
      text: Transforme sistemas legados em cloud native com containers e serverless.
      url: /#services
      buttonText: Saiba Mais
    - title: Otimização de Custos
      icon: piggy-bank
      text: Análise de consumo, rightsizing e governança financeira na nuvem.
      url: /#services
      buttonText: Saiba Mais
  section2:
    title: Por que escolher a Slim Services?
    subtitle: Extensão do seu time. Nuvem, operação e resultados.
    features:
    - title: Estratégia + Execução
      text: Expertise técnica profunda é nosso diferencial. Arquitetura robusta, automação inteligente e soluções que escalam sem comprometer performance.
      icon: code
    - title: Confiabilidade Garantida
      text: Especialistas em infraestrutura resiliente que aguenta picos de tráfego. Disponibilidade e performance sem apagar incêndio.
      icon: shield
    - title: Financeiro Inteligente
      text: Reduzimos custos sem sacrificar qualidade. Infraestrutura otimizada que entrega mais por menos.
      icon: wallet
    - title: Seu Sucesso é Nosso
      text: Não somos fornecedores, somos parceiros. Crescemos com você, alinhando tecnologia aos seus objetivos reais.
      icon: handshake
  section3:
    title: Expertise Certificada
    subtitle: Expertise validada por certificações de nível profissional
    buttonText: Fale Conosco
    buttonLink: "#section5"
    certifications:
    - image: sa-pro.png
    - image: devops-pro.png
    - image: cloud-prac.png
    - image: ai-prac.png
    - image: sysops-ass.png
    - image: sa-ass.png
    - image: dev-ass.png
  section4:
    title: Nossos Clientes Confiam em Nós
    subtitle: Transformação digital bem-sucedida com AWS
    clients:
    - name: Marina Costa
      quote: A Slim Services transformou completamente nossa infraestrutura em nuvem. Reduzimos custos e melhoramos significativamente a performance das aplicações.
      job: CTO - Empresa de Tecnologia
      img: 1
    - name: Carlos Silva
      quote: Consultoria excelente! O time da Slim Services nos ajudou a migrar para AWS com segurança e sem interrupções. Muito profissional e atencioso.
      job: Diretor de Operações
      img: 2
    - name: Roberto Mendes
      quote: Parceria estratégica que fez toda a diferença. A expertise em AWS da Slim Services é incomparável. Recomendo muito para qualquer empresa.
      job: Gerente de Projetos
      img: 3
  section5:
    title: Vamos Conversar
    subtitle: Entre em contato para uma consultoria gratuita sobre sua infraestrutura em nuvem
    buttonText: Enviar Mensagem
    action: https://formspree.io/f/xojnlwbb
    method: POST
