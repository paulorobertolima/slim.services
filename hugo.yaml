  section1:
    title: Serviços AWS Cloud
    subtitle: Soluções completas para sua transformação digital
    tiles:
    - title: Arquitetura Cloud
      icon: laptop-cloud
      text: Design e implementação de arquiteturas escaláveis.
      url: /#services
      buttonText: Saiba Mais
    - title: Migração AWS
      icon: doc-sync
      text: Migração segura e eficiente de suas aplicações e dados.
      url: /#services
      buttonText: Saiba Mais
    - title: Otimização de Custos
      icon: plug-cloud
      text: Reduza gastos em nuvem com análise de recursos.
      url: /#services
      buttonText: Saiba Mais
  section2:
    title: Por que escolher Slim Services?
    subtitle: Expertise AWS focada em resultados
    features:
    - title: Certificação AWS Partner
      text: Nosso time possui certificações avançadas AWS, garantindo melhores práticas e soluções de qualidade para sua infraestrutura em nuvem.
      # Icon (from static/images/illustrations/icons/___.svg)
      icon: laptop-globe
    - title: Suporte Especializado
      text: Monitoramento contínuo de suas operações em nuvem com alertas e suporte técnico especializado disponível sempre que precisar.
      icon: doc-sync
    - title: Otimização Contínua
      text: Análise periódica de performance, segurança e custos para garantir que sua infraestrutura AWS esteja sempre otimizada e alinhada com seus objetivos.
      icon: mobile-feed
  section3:
    title: Soluções AWS Personalizadas
    subtitle: Infraestrutura em nuvem adaptada às suas necessidades
    image: illustrations/mockups/app-mockup.png
    buttonText: Solicitar Proposta
    buttonLink: "#contact"
  section4:
    title: Nossos Clientes Confiam em Nós
    subtitle: Transformação digital bem-sucedida com AWS
    clients:
    - name: Marina Costa
      quote: A Slim Services transformou completamente nossa infraestrutura em nuvem. Reduzimos custos e melhoramos significativamente a performance das aplicações.
      job: CTO - Empresa de Tecnologia
      img: 1
    - name: Carlos Silva
      quote: Consultoria excelente! O time da Slim Services nos ajudou a migrar para AWS com segurança e sem interrupções. Muito profissional e atencioso.
      job: Diretor de Operações
      img: 2
    - name: Roberto Mendes
      quote: Parceria estratégica que fez toda a diferença. A expertise em AWS da Slim Services é incomparável. Recomendo muito para qualquer empresa.
      job: Gerente de Projetos
      img: 3
  section5:
    title: Vamos Conversar
    subtitle: Entre em contato para uma consultoria gratuita sobre sua infraestrutura em nuvem
    buttonText: Enviar Mensagem
    # action: https://formspree.io/f/<form_id>
    # method: POST
