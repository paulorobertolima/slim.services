baseURL: https://slim.services/
languageCode: pt-br
title: Consultoria AWS Brasil | Especialistas em Cloud

theme: 'hugo-fresh'

googleAnalytics: G-MWCXMMRMT2

outputs:
  home:
    - HTML
    - Sitemap
    # - JSON
    # - RSS

# Disables warnings
disableKinds:
- taxonomy
markup:
  goldmark:
    renderer:
      unsafe: true # Allows you to write raw html in your md files

params:
  # Open graph allows easy social sharing. If you don't want it you can set it to false or just delete the variable
  openGraph: true
  # Used as meta data; describe your site to make Google Bots happy
  description: Consultoria AWS especializada no Brasil. Arquitetura cloud, migração segura, otimização de custos e suporte técnico completo. Certificados AWS Partner.
  # Preloader ensures images are loaded before displaying to the user. If you don't want it uncomment to set it to false
  # preloader: false
  navbarlogo:
  # Logo (from static/images/logos/___)
    #image: logos/fresh.svg
    image: logos/slim.svg
    link: /
    # Default width/height. Uncomment if you need to change
    width: 240
    height: 28
  font:
    name: "Open Sans"
    sizes: [400,600]
  hero:
    # Main hero title
    title: Nuvem com Propósito e Expertise
    # Hero subtitle (optional)
    subtitle: Infraestrutura que escala. Custos otimizados. Time que entende seu negócio
    # Button text
    buttontext: Quero evoluir minha cloud agora
    # Show arrow icon on button
    buttonicon: true
    # Where the main hero button links to
    buttonlink: "#contact"
    # Hero image (from static/images/___)
    image: illustrations/worker.svg
    # Footer logos (from static/images/logos/clients/*.svg)
    # urls are optional
    clientlogos:
    - logo: aws
      url: https://aws.amazon.com
    - logo: terraform
      url: https://www.terraform.io
    - logo: kubernetes
      url: https://kubernetes.io
    - logo: docker
      url: https://www.docker.com
    - logo: github
      url: https://github.com
    - logo: gitlab
      url: https://about.gitlab.com
  # Customizable navbar. For a dropdown, add a "sublinks" list.
  navbar:
  - title: Serviços
    url: /#services
  - title: Soluções
    url: /#solutions
  - title: Sobre
    sublinks:
    - title: Nossa Empresa
      url: /#about
    - title: Time
      url: /#team
    - title: Certificações
      url: /#certifications
  - title: Blog
    url: /blog
  - title: Contato
    url: /#contact
    button: true
