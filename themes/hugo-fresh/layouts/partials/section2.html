{{- $section2 := .Site.Params.section2 }}
{{- $title    := index $section2 "title" }}
{{- $subtitle := index $section2 "subtitle" }}
{{- $features := index $section2 "features" }}
<section class="section is-medium" id="section2">
  <div class="container">
    <div class="title-wrapper has-text-centered">
      <h2 class="title is-2">{{ $title }}</h2>
      <h3 class="subtitle is-5 is-muted">{{ $subtitle }}</h3>
      <div class="divider is-centered"></div>
    </div>

    <div class="content-wrapper">
      <div class="columns is-multiline">
        {{- range $features }}
        <div class="column is-half">
          <div class="feature-box has-text-centered">
            <div class="feature-box-icon">
              <i class="fa-solid fa-{{ .icon }} icon-primary" style="font-size: 2.5rem;"></i>
            </div>
            <h4 class="feature-box-title">{{ .title }}</h4>
            <p class="feature-box-text">{{ .text }}</p>
          </div>
        </div>
        {{- end }}
      </div>
    </div>
  </div>
</section>
